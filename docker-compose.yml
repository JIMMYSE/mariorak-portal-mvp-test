version: '3.9'
services:
  airforce-meta-front:
    build: .
    ports:
      - '80:80'
    volumes:
      - type: bind
        source: ../logs
        target: /app/logs
        read_only: false
    environment:
      TZ: 'Asia/Seoul'
    stop_grace_period: 60s # 컨테이너 정지시 SIGTERM 시그널 후 SIGKILL 시그널을 보내기 전까지의 시간 # https://docs.docker.com/compose/compose-file/compose-file-v3/#stop_grace_period
