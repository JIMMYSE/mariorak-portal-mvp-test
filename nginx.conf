server {
    listen 80;
    server_name client;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files               $uri $uri/ /index.html;
    }

    error_page 404              /index.html;

    error_log                   /app/logs/error.log;
    access_log                  /app/logs/access.log;
}